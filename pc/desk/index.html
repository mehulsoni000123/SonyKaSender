<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sony Ka Sender</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/icon.png">
<style>
  :root{
    --desk:#0c5470; --desk2:#0a4560; --line:rgba(190,235,255,.075); --line2:rgba(190,235,255,.16);
    --ink:#eaf6ff; --muted:rgba(225,243,255,.62); --accent:#7cc7ff; --violet:#8b6cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--desk2);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none}
  #desk{position:fixed;inset:0;perspective:1600px;perspective-origin:50% 120%;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(40,150,190,.35) 0%, rgba(8,40,60,0) 60%),
      linear-gradient(var(--line2) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(90deg,var(--line2) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg,var(--line) 1px, transparent 1px) 0 0/24px 24px,
      var(--desk);}
  /* soft window-blind light falling across the desk */
  #blinds{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:soft-light;opacity:.55;
    background:repeating-linear-gradient(-28deg, rgba(255,255,255,.0) 0 70px, rgba(255,255,255,.55) 70px 120px, rgba(255,255,255,0) 120px 190px);
    filter:blur(18px);transform:translateX(-4%);animation:drift 40s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(4%)}}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(0,15,28,.55) 100%)}
  /* rulers */
  .ruler{position:absolute;pointer-events:none;color:rgba(200,236,255,.45);font:500 10px/1 "Cascadia Mono",Consolas,monospace}
  #rulerTop{left:0;right:0;top:0;height:22px;border-bottom:1px solid var(--line2);
    background:linear-gradient(90deg,rgba(200,236,255,.35) 1px,transparent 1px) 0 14px/24px 8px repeat-x, linear-gradient(90deg,rgba(200,236,255,.5) 1px,transparent 1px) 0 6px/120px 16px repeat-x}
  #rulerRight{top:0;bottom:0;right:0;width:22px;border-left:1px solid var(--line2);
    background:linear-gradient(rgba(200,236,255,.35) 1px,transparent 1px) 14px 0/8px 24px repeat-y, linear-gradient(rgba(200,236,255,.5) 1px,transparent 1px) 6px 0/16px 120px repeat-y}
  .ruler span{position:absolute}
  /* tagline */
  #tagline{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .8s}
  #tagline h1{font:400 44px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.5px;color:rgba(235,248,255,.85)}
  #tagline p{margin-top:14px;font-size:14px;color:var(--muted);letter-spacing:.3px}
  body.has-cards #tagline{opacity:.18}
  body.has-cards #tagline p{opacity:0}
  /* status */
  #brand{position:absolute;left:34px;top:38px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:.2px;color:rgba(235,248,255,.9);z-index:99999}
  #brand img{width:26px;height:26px;border-radius:7px}
  #status{position:absolute;right:44px;top:36px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(5,30,45,.45);border:1px solid rgba(190,235,255,.18);font-size:12.5px;color:var(--muted);backdrop-filter:blur(8px);z-index:99999}
  #status i{width:8px;height:8px;border-radius:50%;background:#46e39a;box-shadow:0 0 0 4px rgba(70,227,154,.15)}
  #status.off i{background:#ff6b6b;box-shadow:0 0 0 4px rgba(255,107,107,.15)}
  /* dock */
  #dock{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:16px;background:rgba(5,30,45,.5);border:1px solid rgba(190,235,255,.16);backdrop-filter:blur(10px);z-index:99999}
  #dock button{all:unset;cursor:pointer;padding:8px 13px;border-radius:10px;font-size:12.5px;color:rgba(235,248,255,.85)}
  #dock button:hover{background:rgba(190,235,255,.12)}
  /* cards */
  .card{position:absolute;left:0;top:0;transform-style:preserve-3d;cursor:grab;will-change:transform}
  .card.dragging{cursor:grabbing}
  .inner{position:relative;transform-style:preserve-3d;transform-origin:50% 60%}
  .face{position:relative;border-radius:5px;overflow:hidden;background:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 6px rgba(0,0,0,.25),0 26px 50px -10px rgba(0,10,20,.55);transition:box-shadow .25s,outline-color .2s;outline:3px solid transparent;outline-offset:3px}
  .card.lifted .face{box-shadow:0 2px 6px rgba(0,0,0,.25),0 50px 80px -12px rgba(0,10,20,.65)}
  .card.selected .face{outline-color:#8fd3ff}
  .face.photo{padding:7px;background:#fbfbf8}
  .face.photo img,.face.photo video{display:block;width:auto;height:auto;max-width:min(300px,26vw);max-height:min(360px,40vh);min-width:120px;min-height:90px;object-fit:cover;border-radius:2px;pointer-events:none;background:#ddd}
  .face .play{position:absolute;right:14px;bottom:14px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
  .face .play:after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
  .face.doc{width:210px;height:280px;background:#fdfdfb;color:#1d2733;padding:22px 20px}
  .doc .ext{display:inline-block;font:700 11px/1 "Segoe UI";letter-spacing:.6px;padding:5px 8px;border-radius:5px;background:#1749d6;color:#fff}
  .doc .dn{margin-top:14px;font:600 15px/1.3 "Segoe UI";word-break:break-word;max-height:80px;overflow:hidden}
  .doc .lines{margin-top:16px}
  .doc .lines b{display:block;height:7px;border-radius:3px;background:#e7ebf1;margin:9px 0}
  .doc .lines b.hl{background:#ffe680}
  .doc .ds{position:absolute;left:20px;bottom:18px;font-size:11px;color:#7a8696}
  .face.link{width:300px;background:#11192b;color:#eaf1ff;padding:18px 18px 16px}
  .link .dom{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .link .dom:before{content:"";width:18px;height:18px;border-radius:5px;background:linear-gradient(#5b8cff,#8b6cff)}
  .link .u{margin-top:10px;font-size:12px;color:#9fb0d0;word-break:break-all;max-height:48px;overflow:hidden}
  .link .open{margin-top:14px;font-size:11.5px;color:#7cc7ff}
  .face.note{width:240px;background:#fff8c9;color:#2c2a1d;padding:18px;font:15px/1.45 Georgia,serif;white-space:pre-wrap;max-height:300px}
  .prog{position:absolute;left:14px;right:14px;bottom:14px;height:5px;border-radius:3px;background:rgba(0,0,0,.25);overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .15s}
  .label{position:absolute;left:50%;top:100%;transform:translate(-50%,10px);white-space:nowrap;font-size:11.5px;color:rgba(235,248,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s}
  .card:hover .label{opacity:1}
  .ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid rgba(190,235,255,.7);pointer-events:none}
  #marquee{position:absolute;border:1px solid rgba(143,211,255,.9);background:rgba(143,211,255,.12);border-radius:4px;display:none;z-index:99998}
  /* group panel */
  .panel{position:absolute;z-index:99999;width:290px;padding:16px;border-radius:16px;background:rgba(18,20,34,.92);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 60px rgba(0,0,0,.45);backdrop-filter:blur(12px);color:#eef1ff;transform-origin:50% 100%}
  .panel small{font-size:11px;color:#8d93ad}
  .panel h3{margin:6px 0 4px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel p{font-size:12px;color:#a3a9c2;line-height:1.4}
  .panel .row{display:flex;gap:8px;margin-top:12px}
  .btn{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);color:#eef1ff}
  .btn:hover{filter:brightness(1.2)}
  .btn.v{background:#7b5cff}
  .btn.r{background:#e5484d}
  .panel .foot{margin-top:10px;font-size:11px;color:#757b95}
  /* modal */
  #modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,10,20,.35);z-index:100000}
  #modal .box{width:420px;padding:20px;border-radius:14px;background:#1b1d2b;border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 80px rgba(0,0,0,.5)}
  #modal h4{font-size:14px;font-weight:600;margin-bottom:16px}
  #modal label{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:12.5px;color:#a3a9c2}
  #modal label span{width:90px;text-align:right}
  #modal input,#modal select{flex:1;padding:7px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:#11131d;color:#fff;font:13px "Segoe UI";outline:none;user-select:text}
  #modal input:focus{border-color:#7b5cff}
  #modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #menu{position:absolute;display:none;z-index:100001;min-width:170px;padding:5px;border-radius:10px;background:rgba(24,26,38,.96);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.45)}
  #menu div{padding:8px 12px;border-radius:6px;font-size:12.5px;cursor:pointer}
  #menu div:hover{background:#7b5cff}
  #toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;transition:.35s;padding:9px 16px;border-radius:999px;background:rgba(18,20,34,.92);font-size:12.5px;z-index:100002;pointer-events:none}
  #toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="desk">
  <div id="blinds"></div>
  <div id="rulerTop" class="ruler"></div>
  <div id="rulerRight" class="ruler"></div>
  <div id="tagline"><h1>Give it a little flick.</h1><p>Open Sony Ka Sender on your phone and flick a photo, video or file up to this screen.</p></div>
  <div id="vignette"></div>
  <div id="marquee"></div>
</div>
<div id="brand"><img src="/static/icon.png" alt="">Sony Ka Sender</div>
<div id="status" class="off"><i></i><span id="statusText">Connecting…</span></div>
<div id="dock">
  <button id="bTidy">Tidy up</button>
  <button id="bFolder">Received folder</button>
  <button id="bClear">Clear desk</button>
  <button id="bFull">Full screen</button>
</div>
<div id="menu"><div data-a="open">Open</div><div data-a="reveal">Show in folder</div><div data-a="remove">Remove from desk</div></div>
<div id="modal"><div class="box">
  <h4>Name your new folder and choose where it belongs.</h4>
  <label><span>Folder name:</span><input id="fName" value="New collection"></label>
  <label><span>Where:</span><select id="fWhere"><option>Desktop</option><option>Downloads</option><option>Pictures</option><option>Documents</option></select></label>
  <div class="row"><button class="btn" id="fCancel">Cancel</button><button class="btn v" id="fCreate">Create folder</button></div>
</div></div>
<div id="toast"></div>

<script>
const desk = document.getElementById('desk');
const cards = new Map();           // id -> {data, el, inner}
let zTop = 10, info = {};
const W = () => window.innerWidth, H = () => window.innerHeight;
const $ = s => document.querySelector(s);

// ---------- rulers ----------
function drawRulers(){
  const t = $('#rulerTop'), r = $('#rulerRight');
  t.querySelectorAll('span').forEach(s=>s.remove()); r.querySelectorAll('span').forEach(s=>s.remove());
  for(let x=120,i=1;x<W();x+=120,i++){const s=document.createElement('span');s.textContent=i*5;s.style.left=(x+4)+'px';s.style.top='2px';t.appendChild(s)}
  for(let y=120,i=1;y<H();y+=120,i++){const s=document.createElement('span');s.textContent=i*5;s.style.top=(y+4)+'px';s.style.left='2px';s.style.writingMode='vertical-rl';r.appendChild(s)}
}
drawRulers(); addEventListener('resize',()=>{drawRulers(); cards.forEach(place)});

// ---------- sound (tiny synthesized whoosh + soft landing) ----------
let ac;
function audio(){ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function whoosh(){
  try{
    const a = audio(), n = a.sampleRate*0.9, buf = a.createBuffer(1,n,a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1);
    const src=a.createBufferSource(); src.buffer=buf;
    const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.9;
    f.frequency.setValueAtTime(300,a.currentTime); f.frequency.exponentialRampToValueAtTime(2600,a.currentTime+0.45); f.frequency.exponentialRampToValueAtTime(500,a.currentTime+0.85);
    const g=a.createGain(); g.gain.setValueAtTime(0,a.currentTime); g.gain.linearRampToValueAtTime(0.22,a.currentTime+0.3); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.88);
    src.connect(f).connect(g).connect(a.destination); src.start();
    // landing tap
    const o=a.createOscillator(), og=a.createGain(); o.type='sine';
    o.frequency.setValueAtTime(180,a.currentTime+0.62); o.frequency.exponentialRampToValueAtTime(70,a.currentTime+0.8);
    og.gain.setValueAtTime(0,a.currentTime+0.6); og.gain.linearRampToValueAtTime(0.25,a.currentTime+0.63); og.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.9);
    o.connect(og).connect(a.destination); o.start(a.currentTime+0.6); o.stop(a.currentTime+0.95);
  }catch(e){}
}
addEventListener('pointerdown',()=>audio(),{once:true});

// ---------- card rendering ----------
function fmtSize(b){ if(!b) return ''; const u=['B','KB','MB','GB']; let i=0; while(b>=1024&&i<3){b/=1024;i++} return b.toFixed(i?1:0)+' '+u[i]; }
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function baseWidth(d){ return d.kind==='image'||d.kind==='video' ? 250 : 0; }

function faceHTML(d, src){
  if(d.kind==='image'){
    return `<div class="face photo"><img draggable="false" src="${src||d.thumb||''}">${d.file?'':'<div class="prog"><i></i></div>'}</div>`;
  }
  if(d.kind==='video'){
    const media = d.file ? `<video src="/files/${encodeURIComponent(d.file)}" muted loop autoplay playsinline preload="metadata"></video>` : `<img draggable="false" src="${d.thumb||''}">`;
    return `<div class="face photo">${media}<div class="play"></div>${d.file?'':'<div class="prog"><i></i></div>'}</div>`;
  }
  if(d.kind==='link'){
    return `<div class="face link"><div class="dom">${esc(d.name)}</div><div class="u">${esc(d.url)}</div><div class="open">Opened in your browser · double-click to open again</div></div>`;
  }
  if(d.kind==='note'){ return `<div class="face note">${esc(d.text)}</div>`; }
  const ext = (d.name.split('.').pop()||'FILE').slice(0,5).toUpperCase();
  return `<div class="face doc"><span class="ext">${esc(ext)}</span><div class="dn">${esc(d.name)}</div>
    <div class="lines"><b style="width:92%"></b><b class="hl" style="width:78%"></b><b style="width:85%"></b><b class="hl" style="width:60%"></b><b style="width:88%"></b><b style="width:70%"></b></div>
    <div class="ds">${fmtSize(d.size)}</div>${d.file?'':'<div class="prog" style="background:#e7ebf1"><i style="background:#7b5cff"></i></div>'}</div>`;
}

function makeCard(d){
  const el = document.createElement('div'); el.className='card';
  el.innerHTML = `<div class="inner">${faceHTML(d, d.file && d.kind==='image' ? '/files/'+encodeURIComponent(d.file) : null)}<div class="label">${esc(d.name)} · from ${esc(d.from||'Phone')}</div></div>`;
  desk.appendChild(el);
  const c = {data:d, el, inner: el.firstElementChild};
  cards.set(d.id, c);
  el.style.zIndex = d.z || ++zTop; zTop = Math.max(zTop, d.z||0);
  wire(c); place(c); updateBody();
  return c;
}
function place(c){
  const d=c.data;
  c.el.style.transform = `translate3d(${d.x*W()}px,${d.y*H()}px,0) translate(-50%,-50%) rotate(${d.rot||0}deg) scale(${d.scale||1})`;
}
function updateBody(){ document.body.classList.toggle('has-cards', cards.size>0); }

// ---------- the flight ----------
function flyIn(c){
  const d=c.data, startX = (0.5 - d.x)*W()*0.6;
  const fromRot = (Math.random()-0.5)*30;
  whoosh();
  const anim = c.inner.animate([
    {transform:`translate3d(${startX}px, ${H()*1.05}px, 420px) rotateX(62deg) rotateZ(${fromRot}deg) scale(.55)`, opacity:0, filter:'blur(6px)'},
    {opacity:1, filter:'blur(0px)', offset:.18},
    {transform:`translate3d(${startX*0.15}px, -46px, 140px) rotateX(-10deg) rotateZ(${-fromRot*0.15}deg) scale(1.07)`, offset:.6},
    {transform:`translate3d(0, 9px, 0) rotateX(4deg) rotateZ(0deg) scale(.985)`, offset:.8},
    {transform:`translate3d(0, -2px, 0) rotateX(-1deg) scale(1.003)`, offset:.92},
    {transform:'none', opacity:1, filter:'blur(0px)'}
  ], {duration:1150, easing:'cubic-bezier(.22,.8,.3,1)'});
  c.el.classList.add('lifted');
  anim.onfinish = () => { c.el.classList.remove('lifted'); ripple(d); };
}
function ripple(d){
  if(!isFinite(d.x)||!isFinite(d.y)) return;
  const r=document.createElement('div'); r.className='ripple';
  r.style.left=d.x*W()+'px'; r.style.top=d.y*H()+'px'; desk.appendChild(r);
  r.animate([{transform:'scale(1)',opacity:.9},{transform:'scale(16)',opacity:0}],{duration:900,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>r.remove();
}
function land(d){
  let c = cards.get(d.id);
  if(!c){ c = makeCard(d); flyIn(c); return; }
  c.data = Object.assign(c.data, d);
  const face = c.inner.querySelector('.face');
  const html = faceHTML(c.data, d.kind==='image' && d.file ? '/files/'+encodeURIComponent(d.file) : null);
  const tmp=document.createElement('div'); tmp.innerHTML=html; const nf=tmp.firstElementChild;
  if(d.kind==='image'){ const img=nf.querySelector('img'); img.onload=()=>{face.replaceWith(nf);}; img.onerror=()=>{const p=face.querySelector('.prog'); p&&p.remove();}; }
  else face.replaceWith(nf);
}

// ---------- live events ----------
function connect(){
  const es = new EventSource('/events');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.type==='hello'){ info=m; $('#status').classList.remove('off'); $('#statusText').textContent = `Ready · ${m.name} · ${(m.ips||[])[0]||'no Wi-Fi'}`; }
    if(m.type==='incoming'){ if(!cards.has(m.card.id)){ const c=makeCard(m.card); flyIn(c);} toast(`Incoming from ${m.card.from}…`); }
    if(m.type==='progress'){ const c=cards.get(m.id); const bar=c&&c.inner.querySelector('.prog i'); if(bar) bar.style.width=(m.p*100).toFixed(1)+'%'; }
    if(m.type==='landed'){ land(m.card); }
    if(m.type==='failed'){ const c=cards.get(m.id); if(c){ c.el.animate([{opacity:1},{opacity:0,transform:c.el.style.transform+' scale(.8)'}],{duration:400}).onfinish=()=>{c.el.remove();cards.delete(m.id);updateBody();}; toast('A transfer was interrupted'); } }
  };
  es.onerror = () => { $('#status').classList.add('off'); $('#statusText').textContent='Reconnecting…'; };
}
fetch('/api/desk').then(r=>r.json()).then(s=>{ (s.cards||[]).forEach(d=>makeCard(d)); connect(); });

// ---------- persistence ----------
let saveT;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>fetch('/api/desk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cards:[...cards.values()].map(c=>({id:c.data.id,x:c.data.x,y:c.data.y,rot:c.data.rot,scale:c.data.scale,z:+c.el.style.zIndex}))})}),400); }
const post = (u,b) => fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());

// ---------- selection / groups ----------
const selected = new Set();
let group = null; // {ids, before: Map(id->{x,y,rot})}
function setSel(ids){
  selected.forEach(id=>cards.get(id)?.el.classList.remove('selected'));
  selected.clear(); ids.forEach(id=>{selected.add(id); cards.get(id)?.el.classList.add('selected');});
}
function stack(ids){
  const list = ids.map(id=>cards.get(id)).filter(Boolean);
  if(list.length<2) return;
  const cx = list.reduce((s,c)=>s+c.data.x,0)/list.length, cy = list.reduce((s,c)=>s+c.data.y,0)/list.length;
  group = {ids, before:new Map(list.map(c=>[c.data.id,{x:c.data.x,y:c.data.y,rot:c.data.rot}]))};
  list.forEach((c,i)=>{
    c.data.x = cx + (i-(list.length-1)/2)*0.006; c.data.y = cy - i*0.004; c.data.rot = (i-(list.length-1)/2)*4;
    c.el.style.zIndex = ++zTop; c.el.style.transition='transform .55s cubic-bezier(.2,.8,.2,1)'; place(c);
    setTimeout(()=>c.el.style.transition='',600);
  });
  showPanel(cx,cy,list.length); persist();
}
function unstack(){
  if(!group) return;
  group.before.forEach((b,id)=>{const c=cards.get(id); if(!c) return; Object.assign(c.data,b); c.el.style.transition='transform .55s cubic-bezier(.2,.8,.2,1)'; place(c); setTimeout(()=>c.el.style.transition='',600);});
  group=null; hidePanel(); setSel([]); persist();
}
let panel=null;
function showPanel(cx,cy,n){
  hidePanel();
  panel=document.createElement('div'); panel.className='panel';
  panel.innerHTML=`<small>Your group</small><h3>◈ ${n} together.</h3><p>Drag your stack anywhere on the desk, or save it as a folder.</p>
    <div class="row"><button class="btn" data-a="back">↩ Put back</button><button class="btn v" data-a="save">Save folder…</button><button class="btn r" data-a="rm">Remove</button></div>
    <div class="foot">Originals stay in your received folder.</div>`;
  document.body.appendChild(panel);
  const px = Math.min(W()-310, Math.max(20, cx*W()-145)), py = Math.max(70, cy*H()-260);
  panel.style.left=px+'px'; panel.style.top=py+'px';
  panel.animate([{opacity:0,transform:'translateY(10px) scale(.96)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
  panel.onclick=e=>{const a=e.target.dataset.a; if(a==='back') unstack(); if(a==='save') openModal(); if(a==='rm') removeCards([...selected]);};
}
function hidePanel(){ if(panel){panel.remove(); panel=null;} }

// ---------- pointer interactions ----------
function wire(c){
  const el=c.el;
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    e.stopPropagation(); hideMenu();
    if(e.ctrlKey||e.shiftKey){ const s=new Set(selected); s.has(c.data.id)?s.delete(c.data.id):s.add(c.data.id); setSel([...s]); if(s.size>=2) stack([...s]); return; }
    const movingGroup = selected.has(c.data.id) && selected.size>1 ? [...selected].map(id=>cards.get(id)).filter(Boolean) : [c];
    if(!selected.has(c.data.id)){ setSel([]); hidePanel(); group=null; }
    movingGroup.forEach(m=>m.el.style.zIndex=++zTop);
    el.setPointerCapture(e.pointerId); el.classList.add('dragging','lifted');
    let lx=e.clientX, ly=e.clientY, vx=0, vy=0, lt=performance.now();
    const move=ev=>{
      const dx=ev.clientX-lx, dy=ev.clientY-ly, now=performance.now(), dt=Math.max(1,now-lt);
      vx=dx/dt; vy=dy/dt; lx=ev.clientX; ly=ev.clientY; lt=now;
      movingGroup.forEach(m=>{m.data.x+=dx/W(); m.data.y+=dy/H(); place(m);});
      if(panel){ panel.style.left=(parseFloat(panel.style.left)+dx)+'px'; panel.style.top=(parseFloat(panel.style.top)+dy)+'px'; }
    };
    const up=()=>{
      el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.classList.remove('dragging','lifted');
      // a little glide after a throw
      let f=0; const glide=()=>{ if(Math.hypot(vx,vy)<0.02||f++>40){persist();return;} vx*=0.88; vy*=0.88;
        movingGroup.forEach(m=>{m.data.x=Math.min(.97,Math.max(.03,m.data.x+vx*16/W())); m.data.y=Math.min(.95,Math.max(.06,m.data.y+vy*16/H())); place(m);}); requestAnimationFrame(glide); };
      if(performance.now()-lt<60) glide(); else persist();
    };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
  });
  el.addEventListener('dblclick',()=>post('/api/open',{id:c.data.id}));
  el.addEventListener('wheel',e=>{ e.preventDefault(); const k=Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)); c.data.scale=Math.min(4,Math.max(.35,(c.data.scale||1)*k)); place(c); persist(); },{passive:false});
  el.addEventListener('contextmenu',e=>{e.preventDefault(); showMenu(e.clientX,e.clientY,c.data.id);});
}

// marquee
const mq=$('#marquee'); let mStart=null;
desk.addEventListener('pointerdown',e=>{
  if(e.button!==0) return; hideMenu();
  if(group && !e.ctrlKey){ group=null; hidePanel(); }
  setSel([]); mStart={x:e.clientX,y:e.clientY}; desk.setPointerCapture(e.pointerId);
  Object.assign(mq.style,{display:'block',left:e.clientX+'px',top:e.clientY+'px',width:0,height:0});
});
desk.addEventListener('pointermove',e=>{
  if(!mStart) return;
  const x=Math.min(e.clientX,mStart.x), y=Math.min(e.clientY,mStart.y), w=Math.abs(e.clientX-mStart.x), h=Math.abs(e.clientY-mStart.y);
  Object.assign(mq.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  const ids=[]; cards.forEach((c,id)=>{const r=c.el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; if(cx>x&&cx<x+w&&cy>y&&cy<y+h) ids.push(id);});
  setSel(ids);
});
desk.addEventListener('pointerup',()=>{ if(!mStart) return; mStart=null; mq.style.display='none'; if(selected.size>=2) stack([...selected]); });

// context menu
const menu=$('#menu'); let menuId=null;
function showMenu(x,y,id){ menuId=id; Object.assign(menu.style,{display:'block',left:x+'px',top:y+'px'}); }
function hideMenu(){ menu.style.display='none'; }
menu.onclick=e=>{ const a=e.target.dataset.a; if(a==='open') post('/api/open',{id:menuId}); if(a==='reveal') post('/api/reveal',{id:menuId}); if(a==='remove') removeCards([menuId]); hideMenu(); };

function removeCards(ids){
  ids.forEach(id=>{const c=cards.get(id); if(!c) return; c.el.animate([{opacity:1},{opacity:0,filter:'blur(4px)'}],{duration:300}).onfinish=()=>{c.el.remove(); cards.delete(id); updateBody();};});
  post('/api/remove',{ids}); group=null; hidePanel(); setSel([]);
}

// save-folder modal
function openModal(){ $('#modal').style.display='grid'; const i=$('#fName'); i.value='New collection'; setTimeout(()=>{i.focus(); i.select();},30); }
$('#fCancel').onclick=()=>$('#modal').style.display='none';
$('#fCreate').onclick=async()=>{
  const r=await post('/api/save-folder',{ids:[...selected],name:$('#fName').value,where:$('#fWhere').value});
  $('#modal').style.display='none'; if(r.ok) toast('Saved to '+r.folder); unstack();
};
$('#fName').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#fCreate').click(); if(e.key==='Escape') $('#fCancel').click(); });

// dock
$('#bTidy').onclick=()=>{
  const list=[...cards.values()]; const cols=Math.ceil(Math.sqrt(list.length*W()/H())); const rows=Math.ceil(list.length/cols);
  list.forEach((c,i)=>{const col=i%cols,row=Math.floor(i/cols); c.data.x=(col+1)/(cols+1); c.data.y=0.12+(row+1)/(rows+1)*0.76; c.data.rot=(Math.random()-.5)*4; c.data.scale=Math.min(1,0.9*3/Math.max(3,cols)); c.el.style.transition='transform .6s cubic-bezier(.2,.8,.2,1)'; place(c); setTimeout(()=>c.el.style.transition='',650);});
  persist();
};
$('#bFolder').onclick=()=>post('/api/open-dir');
$('#bClear').onclick=()=>{ if(cards.size) removeCards([...cards.keys()]); toast('Desk cleared · files are still in your received folder'); };
$('#bFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
addEventListener('keydown',e=>{ if(e.key==='Delete' && selected.size && $('#modal').style.display!=='grid') removeCards([...selected]); if(e.key==='Escape'){ hideMenu(); if(group) unstack(); } });

let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2600); }
</script>
</body>
